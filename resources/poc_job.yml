resources:
  jobs:
    poc_job:
      name: poc_job_${bundle.target}
      git_source:
        git_url: https://github.com/gep-giovanny-franco/poc-repo-deploy
        git_provider: gitHub
        git_branch: ${var.git_branch}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        - task_key: teste
          environment_key: default
          spark_python_task:
            python_file: src/teste.py
            source: GIT